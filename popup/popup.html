<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>ComboBreaker</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="22" height="22" />
        <span>ComboBreaker</span>
      </div>
      <div class="site-bar">
        <span id="site-name" class="site-name">—</span>
      </div>
      <button id="open-options" class="icon-btn" title="Open settings">⚙</button>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="site" role="tab">Site</button>
      <button class="tab" data-tab="cookies" role="tab">Cookies</button>
      <button class="tab" data-tab="headers" role="tab">Headers</button>
      <button class="tab" data-tab="redirects" role="tab">Redirects</button>
      <button class="tab" data-tab="tools" role="tab">Tools</button>
    </nav>

    <main>
      <!-- ───────── Site pane ───────── -->
      <section id="pane-site" class="pane active">
        <div class="dark-section">
          <label class="row">
            <span>Dark mode <em class="muted">(all sites)</em></span>
            <input type="checkbox" id="t-darkmode-global" />
          </label>
          <div class="row sm site-override">
            <span>This site</span>
            <div class="seg" role="radiogroup" aria-label="Per-site dark mode">
              <button type="button" class="seg-btn" data-val="">Auto</button>
              <button type="button" class="seg-btn" data-val="on">On</button>
              <button type="button" class="seg-btn" data-val="off">Off</button>
            </div>
          </div>
          <div class="row sm dark-tune-row">
            <button type="button" class="link-btn" id="open-dark-tune">Tune brightness / contrast →</button>
          </div>
        </div>
        <div class="toggles">
          <label class="row">
            <span>JavaScript</span>
            <input type="checkbox" id="t-js" />
          </label>
          <label class="row">
            <span>Custom CSS</span>
            <input type="checkbox" id="t-css" />
          </label>
          <label class="row">
            <span>Custom JS</span>
            <input type="checkbox" id="t-userjs" />
          </label>
        </div>
        <div class="row-actions">
          <button class="link-btn" data-tool="edit-css">Edit CSS →</button>
          <button class="link-btn" data-tool="edit-js">Edit JS →</button>
        </div>
      </section>

      <!-- ───────── Cookies pane ───────── -->
      <section id="pane-cookies" class="pane">
        <div class="cookies-toolbar">
          <span id="cookies-count" class="muted">—</span>
          <button id="cookies-refresh" class="ghost-btn" title="Refresh">↻</button>
          <button id="cookies-nuke" class="danger-btn" title="Delete every cookie for this site">Nuke all</button>
        </div>
        <div id="cookies-list" class="cookies-list">
          <div class="empty muted">Loading…</div>
        </div>
      </section>

      <!-- ───────── Headers pane ───────── -->
      <section id="pane-headers" class="pane">
        <div class="cookies-toolbar">
          <span id="headers-status" class="muted">—</span>
          <button id="headers-refresh" class="ghost-btn" title="Refresh">↻</button>
          <button id="headers-edit" class="ghost-btn" title="Edit overrides for this site in Options">Edit overrides →</button>
        </div>
        <div id="headers-overrides" class="headers-overrides muted"></div>
        <div id="headers-list" class="headers-list">
          <div class="empty muted">Loading…</div>
        </div>
      </section>

      <!-- ───────── Redirects pane ───────── -->
      <section id="pane-redirects" class="pane">
        <div class="cookies-toolbar">
          <span id="redirects-count" class="muted">—</span>
          <button id="redirects-refresh" class="ghost-btn" title="Refresh">↻</button>
          <button id="redirects-copy" class="ghost-btn" title="Copy chain as text">Copy</button>
          <button id="redirects-clear" class="danger-btn" title="Clear chain for this tab">Clear</button>
        </div>
        <div id="redirects-list" class="redirects-list">
          <div class="empty muted">Loading…</div>
        </div>
      </section>

      <!-- ───────── Tools pane ───────── -->
      <section id="pane-tools" class="pane">
        <div class="tools">
          <button class="tool" data-tool="color-picker"><span class="ico">◉</span><span>Color picker</span></button>
          <button class="tool" data-tool="ruler"><span class="ico">⟷</span><span>Ruler</span></button>
          <button class="tool" data-tool="whatfont"><span class="ico">A</span><span>Font inspector</span></button>
          <button class="tool" data-tool="screenshot"><span class="ico">▢</span><span>Full screenshot</span></button>
          <button class="tool" data-tool="encoding"><span class="ico">編</span><span>Encoding…</span></button>
        </div>
        <div class="globals">
          <label class="row sm">
            <span>Adblock (basic)</span>
            <input type="checkbox" id="g-adblock" />
          </label>
          <label class="row sm">
            <span>JSON pretty-print</span>
            <input type="checkbox" id="g-json" />
          </label>
        </div>
      </section>
    </main>

    <div id="status" class="status" hidden></div>

    <!-- ───────── Dialogs ───────── -->
    <dialog id="encoding-dialog">
      <form method="dialog">
        <h3>Override encoding</h3>
        <select id="encoding-select">
          <option value="utf-8">UTF-8</option>
          <option value="windows-1252">Windows-1252 (Western)</option>
          <option value="iso-8859-1">ISO-8859-1</option>
          <option value="iso-8859-2">ISO-8859-2 (Central Eu)</option>
          <option value="iso-8859-15">ISO-8859-15</option>
          <option value="windows-1251">Windows-1251 (Cyrillic)</option>
          <option value="koi8-r">KOI8-R</option>
          <option value="shift_jis">Shift-JIS</option>
          <option value="euc-jp">EUC-JP</option>
          <option value="iso-2022-jp">ISO-2022-JP</option>
          <option value="gbk">GBK (Simplified)</option>
          <option value="gb18030">GB18030</option>
          <option value="big5">Big5 (Traditional)</option>
          <option value="euc-kr">EUC-KR (Korean)</option>
        </select>
        <menu>
          <button value="cancel">Cancel</button>
          <button id="encoding-apply" value="apply">Apply</button>
        </menu>
      </form>
    </dialog>

    <dialog id="dark-tune-dialog">
      <form method="dialog">
        <h3>Dark mode</h3>
        <div class="dark-tune-grid">
          <label class="tune-row">
            <span>Mode</span>
            <select id="tune-mode">
              <option value="1">Dark</option>
              <option value="0">Light</option>
            </select>
          </label>
          <label class="tune-row">
            <span>Brightness</span>
            <span class="tune-slider">
              <input type="range" id="tune-brightness" min="50" max="150" step="5" />
              <output id="tune-brightness-out">100</output>
            </span>
          </label>
          <label class="tune-row">
            <span>Contrast</span>
            <span class="tune-slider">
              <input type="range" id="tune-contrast" min="50" max="150" step="5" />
              <output id="tune-contrast-out">100</output>
            </span>
          </label>
          <label class="tune-row">
            <span>Sepia</span>
            <span class="tune-slider">
              <input type="range" id="tune-sepia" min="0" max="100" step="5" />
              <output id="tune-sepia-out">0</output>
            </span>
          </label>
          <label class="tune-row">
            <span>Grayscale</span>
            <span class="tune-slider">
              <input type="range" id="tune-grayscale" min="0" max="100" step="5" />
              <output id="tune-grayscale-out">0</output>
            </span>
          </label>
        </div>
        <p class="hint muted">Changes apply live to every page with dark mode on.</p>
        <menu>
          <button type="button" id="tune-reset">Reset</button>
          <button value="close">Done</button>
        </menu>
      </form>
    </dialog>

    <dialog id="cookie-dialog">
      <form method="dialog">
        <h3 id="cookie-dialog-title">Edit cookie</h3>
        <label class="field">
          <span>Name</span>
          <input type="text" id="cookie-name" readonly />
        </label>
        <label class="field">
          <span>Value</span>
          <textarea id="cookie-value" rows="6" spellcheck="false"></textarea>
        </label>
        <div class="cookie-meta">
          <span id="cookie-meta-domain"></span>
          <span id="cookie-meta-path"></span>
          <span id="cookie-meta-expires"></span>
          <span id="cookie-meta-flags"></span>
        </div>
        <menu>
          <button value="cancel">Cancel</button>
          <button id="cookie-save" value="save">Save</button>
        </menu>
      </form>
    </dialog>

    <script src="popup.js" type="module"></script>
  </body>
</html>
