name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: combobreaker-zip
          path: dist/*.zip
